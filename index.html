const SUBJECTS=DATA.subjects; const TOPICS=DATA.topics;
const HI={zoology:'प्राणी विज्ञान',botany:'वनस्पति विज्ञान',chemistry:'रसायन विज्ञान',physics:'भौतिक विज्ञान'};
const ICON={zoology:'🧬',botany:'🌿',chemistry:'⚗️',physics:'⚡'};
let done=new Set(JSON.parse(localStorage.getItem('sm_done_v2')||'[]').map(String));
let saved=new Set(JSON.parse(localStorage.getItem('sm_saved_v2')||'[]').map(String));
let recent=JSON.parse(localStorage.getItem('sm_recent_v2')||'[]').map(String);
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const subjName=s=>HI[s]||SUBJECTS[s]?.name||s;
const topicById=id=>TOPICS.find(t=>String(t.id)===String(id));
function persist(){localStorage.setItem('sm_done_v2',JSON.stringify([...done]));localStorage.setItem('sm_saved_v2',JSON.stringify([...saved]));localStorage.setItem('sm_recent_v2',JSON.stringify(recent.slice(0,30)));}
function pct(s){let a=TOPICS.filter(t=>t.subject===s);return a.length?Math.round(a.filter(t=>done.has(String(t.id))).length*100/a.length):0}
function go(route){location.hash=route}
function home(){
 app.innerHTML=`<section class="hero"><span class="badge">🚀 NEET Smart Study</span><h1>NEET की तैयारी<br>अब आसान और व्यवस्थित।</h1><p>सबसे पहले <b>चारों Subjects</b> दिखेंगे। Subject चुनें → उसके <b>Chapters</b> → Chapter चुनें → उसके <b>Topics</b> → Topic खोलें और पूरा structured content पढ़ें।</p><div class="hero-actions"><button class="btn" data-action="subjects">📚 चारों विषय देखें</button><button class="btn light" data-action="random">🎯 Random Topic</button></div></section>
 <section class="section"><div class="head"><div><h2>📚 चारों NEET Subjects</h2><div class="muted">पहले यहीं से अपना subject चुनें</div></div><b>${TOPICS.length} Topics</b></div><div class="grid4">${Object.keys(HI).map(subjectCard).join('')}</div></section>
 <section class="section"><div class="head"><div><h2>🧭 पढ़ाई का सही Flow</h2></div></div><div class="flow"><div class="feature"><b>1️⃣ Subject</b><span class="muted">Zoology, Botany, Chemistry, Physics</span></div><div class="feature"><b>2️⃣ Chapter</b><span class="muted">उस subject के सभी chapters</span></div><div class="feature"><b>3️⃣ Topic</b><span class="muted">पूरा theory + diagram + MCQ + revision</span></div></div></section>
 <section class="section"><div class="head"><h2>📖 हर Topic के अंदर</h2></div><div class="grid4">${[['📖','Introduction','आसान परिचय'],['📌','Definition','सटीक परिभाषा'],['🧩','Structure','मुख्य भाग/घटक'],['⚙️','Function','कार्य और महत्व'],['🔄','Mechanism','प्रक्रिया/steps'],['🎯','NEET Focus','महत्वपूर्ण facts'],['🖼️','Diagram','visual concept map'],['❓','MCQ','उत्तर + explanation']].map(x=>`<div class="feature"><b>${x[0]} ${x[1]}</b><span class="muted">${x[2]}</span></div>`).join('')}</div></section>
 ${recent.length?`<section class="section"><div class="head"><h2>🕘 हाल में पढ़े गए</h2></div><div class="topic-list">${recent.slice(0,6).map(id=>topicById(id)).filter(Boolean).map(topicCard).join('')}</div></section>`:''}
 <section class="section comment-box"><div class="head"><div><h2>💬 Comment / Discussion</h2><div class="muted">StudyMaster NEET के बारे में अपना सवाल, सुझाव या feedback लिखें।</div></div></div><div class="comment-form"><input id="commentName" placeholder="आपका नाम (optional)" maxlength="40"><textarea id="commentText" placeholder="अपना comment लिखें…" maxlength="500"></textarea><button class="btn" id="addComment">💬 Comment पोस्ट करें</button></div><div id="commentsList" class="comments-list"></div></section>`;
 renderComments();
}
function renderComments(){const el=document.getElementById('commentsList');if(!el)return;const arr=JSON.parse(localStorage.getItem('sm_comments_v1')||'[]');el.innerHTML=arr.length?arr.slice(0,20).map(c=>`<div class="comment-item"><b>${esc(c.name||'Student')}</b><small> • ${esc(c.date)}</small><div>${esc(c.text)}</div></div>`).join(''):`<div class="muted">अभी कोई comment नहीं है। पहला comment आप करें।</div>`;const btn=document.getElementById('addComment');if(btn)btn.onclick=()=>{const text=document.getElementById('commentText').value.trim();if(!text)return alert('पहले comment लिखें।');const name=document.getElementById('commentName').value.trim()||'Student';const arr=JSON.parse(localStorage.getItem('sm_comments_v1')||'[]');arr.unshift({name,text,date:new Date().toLocaleString('hi-IN')});localStorage.setItem('sm_comments_v1',JSON.stringify(arr.slice(0,50)));document.getElementById('commentText').value='';renderComments()};}
function subjectCard(s){let n=TOPICS.filter(t=>t.subject===s).length;return `<div class="subject-card" data-subject="${s}" role="button" tabindex="0"><div class="big">${ICON[s]}</div><h3>${subjName(s)}</h3><div class="count">${n} Topics</div><div class="muted">${[...new Set(TOPICS.filter(t=>t.subject===s).map(t=>t.chapter))].length} Chapters</div><div class="bar"><i style="width:${pct(s)}%"></i></div><b>खोलें →</b></div>`}
function subjects(){app.innerHTML=`<div class="crumb" data-action="home">← होम</div><div class="head"><div><h1>📚 चारों NEET Subjects</h1><div class="muted">किसी subject पर click करें, फिर chapters और topics चुनें।</div></div></div><div class="grid4">${Object.keys(HI).map(subjectCard).join('')}</div>`}
function subject(s){let arr=TOPICS.filter(t=>t.subject===s);let chapters=[...new Set(arr.map(t=>t.chapter))];app.innerHTML=`<div class="crumb" data-action="subjects">← चारों विषय</div><div class="head"><div><h1>${ICON[s]} ${subjName(s)}</h1><div class="muted">${chapters.length} Chapters • ${arr.length} Topics • ${pct(s)}% complete</div></div></div><div class="toolbar"><input id="chapterSearch" placeholder="Chapter या topic खोजें…"><button class="btn light" data-action="random-subject" data-subject="${s}">🎯 Random</button></div><div id="chapters" class="grid3">${chapters.map((c,i)=>chapterCard(s,c,i)).join('')}</div>`;document.getElementById('chapterSearch').oninput=e=>filterSubject(s,e.target.value)}
function chapterCard(s,c,i){let n=TOPICS.filter(t=>t.subject===s&&t.chapter===c).length;return `<div class="chapter-card" data-chapter="${esc(c)}" data-subject="${s}"><div class="num">Chapter ${i+1}</div><h3>${esc(c)}</h3><div class="muted">${n} Topics</div><b style="display:block;margin-top:14px;color:var(--primary)">Topics देखें →</b></div>`}
function filterSubject(s,q){q=q.toLowerCase().trim();let arr=TOPICS.filter(t=>t.subject===s && (t.chapter+' '+t.title+' '+(t.chapterHi||'')+' '+(t.titleHi||'')).toLowerCase().includes(q));let el=document.getElementById('chapters');if(!q){let ch=[...new Set(TOPICS.filter(t=>t.subject===s).map(t=>t.chapter))];el.className='grid3';el.innerHTML=ch.map((c,i)=>chapterCard(s,c,i)).join('');return}el.className='topic-list';el.innerHTML=arr.length?arr.map(topicCard).join(''):`<div class="empty">कोई result नहीं मिला।</div>`}
function chapter(s,c){let arr=TOPICS.filter(t=>t.subject===s&&t.chapter===c);app.innerHTML=`<div class="crumb" data-subject="${s}">← ${subjName(s)}</div><div class="head"><div><h1>${ICON[s]} ${esc(c)}</h1><div class="muted">${arr.length} Topics</div></div></div><div class="callout"><b>📚 इस Chapter के सभी Topics</b><br>किसी भी topic पर click करें। अगली screen पर Introduction, Definition, Structure, Function, Mechanism, NEET points, Diagram, MCQ और Quick Revision मिलेगा।</div><div class="topic-list">${arr.map(topicCard).join('')}</div>`}
function topicCard(t){return `<div class="topic-card" data-topic="${esc(t.id)}"><div><b>${esc(t.titleHi||t.title)}</b><small>${esc(t.chapterHi||t.chapter)} • ${esc(t.subjectHi||subjName(t.subject))}</small></div><span class="arrow">›</span></div>`}
function topic(id){let t=topicById(id);if(!t)return home();if(!recent.includes(String(t.id)))recent.unshift(String(t.id));recent=recent.slice(0,30);persist();let idx=TOPICS.findIndex(x=>String(x.id)===String(t.id));let prev=TOPICS[idx-1],next=TOPICS[idx+1];app.innerHTML=`<div class="crumb" data-chapter="${esc(t.chapter)}" data-subject="${t.subject}">← ${esc(t.chapterHi||t.chapter)}</div><section class="topic-hero"><div class="badge">${ICON[t.subject]} ${esc(t.subjectHi||subjName(t.subject))}</div><h1 class="topic-title">${esc(t.titleHi||t.title)}</h1><p class="muted">${esc(t.chapterHi||t.chapter)} • Topic ${idx+1} / ${TOPICS.length}</p><div class="topic-actions"><button class="btn" data-complete="${t.id}">${done.has(String(t.id))?'✅ Completed':'☑️ Mark Complete'}</button><button class="btn light" data-save="${t.id}">${saved.has(String(t.id))?'🔖 Saved':'🔖 Save'}</button><button class="btn light" data-action="subjects">📚 Subjects</button></div></section><div class="toc">${['intro','definition','structure','function','mechanism','neet','diagram','mcq','revision'].map((x,i)=>`<button onclick="document.getElementById('${x}')?.scrollIntoView({behavior:'smooth'})">${['📖 परिचय','📌 परिभाषा','🧩 संरचना','⚙️ कार्य','🔄 प्रक्रिया','🎯 NEET Focus','🖼️ Diagram','❓ MCQ','⚡ Revision'][i]}</button>`).join('')}</div><div class="content-grid"><div>${renderTheory(t)}</div><aside class="side"><div class="quick"><b>⚡ 60-Second Revision</b><ul>${(t.keyPoints||[]).slice(0,7).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></aside></div><div class="navrow"><button class="btn light" data-topic-nav="${prev?prev.id:''}">← Previous</button><button class="btn" data-topic-nav="${next?next.id:''}">Next →</button></div>`;}
const TOPIC_PROFILES={"porifera":["Porifera are mostly aquatic, sessile animals with a porous body and cellular level of organisation. Most are marine and have a canal system.","Body wall has ostia, canals, choanocytes and a spongocoel; water exits through the osculum.","Choanocytes drive water current and help trap food; spicules/spongin provide support.","Water enters ostia → canals → spongocoel → osculum; digestion is mainly intracellular.","Porifera: cellular level, generally asymmetrical, no true tissues; examples include Sycon and Spongilla.","ostia → canal system → spongocoel → osculum"],"cnidaria":["Cnidarians are diploblastic aquatic animals with tissue-level organisation and characteristic cnidocytes used for prey capture and defence.","They have a gastrovascular cavity and occur as polyp and/or medusa forms; symmetry is radial.","Cnidocytes discharge nematocysts and the gastrovascular cavity performs digestion.","Prey contact → cnidocyte discharge → capture → gastrovascular cavity → digestion.","Cnidaria are diploblastic and radially symmetrical; examples include Hydra, Aurelia and corals.","tentacles → cnidocytes → gastrovascular cavity"],"ctenophora":["Ctenophores are exclusively marine, diploblastic animals characterised by eight comb plates of fused cilia used in locomotion.","The body is usually biradially symmetrical and often bears tentacles with colloblasts for prey capture.","Comb plates provide locomotion; colloblasts help capture prey.","Ciliary beating → movement; tentacle/colloblast interaction → prey capture → digestion.","Ctenophores are marine and bioluminescence is common.","8 comb rows → locomotion; tentacles → colloblasts"],"platyhelminthes":["Platyhelminthes are dorsoventrally flattened, bilaterally symmetrical, triploblastic acoelomate animals.","They show organ-system level organisation and have a flattened body suited to diffusion; many parasitic forms possess suckers/hooks.","Flame cells form part of the excretory/osmoregulatory system; parasitic species show adaptations to host life.","Food enters the digestive system → branched gastrovascular cavity distributes nutrients; wastes are handled by protonephridia in relevant forms.","Examples: Planaria, Taenia and Fasciola; acoelomate condition is a key diagnostic feature.","bilateral symmetry → triploblastic → acoelomate → organ-system level"],"annelida":["Annelids are segmented, bilaterally symmetrical, triploblastic coelomate animals with organ-system organisation.","The body is divided into repeated segments; a true coelom is present and a closed circulatory system is typical.","Segmentation supports efficient locomotion and regional specialisation; nephridia perform excretion.","Muscular contraction against fluid-filled coelom → movement; blood circulates through vessels.","Examples include earthworm, leech and Nereis; metameric segmentation is characteristic.","segments → coelom → vessels → nephridia"],"arthropoda":["Arthropods are bilaterally symmetrical, segmented, triploblastic animals with jointed appendages and a chitinous exoskeleton.","Body regions are often specialised; appendages are modified for feeding, locomotion and sensing.","Exoskeleton protects and supports the body; jointed appendages permit versatile movement.","Growth requires moulting because the rigid exoskeleton does not expand continuously.","Arthropoda is the largest animal phylum; examples include insects, crustaceans and arachnids.","segmented body → jointed appendages → chitinous exoskeleton"],"mollusca":["Molluscs are mostly soft-bodied, bilaterally symmetrical animals with a mantle and muscular foot.","The mantle may secrete a shell; a visceral mass contains internal organs and the radula occurs in many molluscs.","Foot enables locomotion or attachment; mantle participates in shell formation and encloses the mantle cavity.","Food capture/feeding → digestion in gut; mantle cavity supports respiration/excretion depending on group.","Examples include Pila, Unio, Sepia and Octopus; body plan differs strongly among molluscan classes.","mantle → visceral mass → muscular foot"],"echinodermata":["Echinoderms are exclusively marine, triploblastic coelomates with a calcareous endoskeleton and a water vascular system.","Adults usually show pentaradial symmetry while larvae are bilaterally symmetrical; tube feet arise from the water vascular system.","Tube feet support locomotion, attachment, feeding and gas exchange in many forms.","Water enters the system → hydraulic pressure operates tube feet → coordinated movement/feeding.","Examples include starfish, brittle stars and sea urchins; regeneration is notable in some members.","madreporite → water vascular system → tube feet"],"chordata":["Chordates are defined by a notochord, dorsal hollow nerve cord, pharyngeal slits, post-anal tail and an endostyle/thyroid-related character at some stage.","These chordate features occur at least during some developmental stage; vertebrates additionally develop a vertebral column and cranium.","The notochord provides axial support in chordate development, while the dorsal nerve cord is associated with the central nervous system.","Embryonic chordate plan → axial support and dorsal neural organisation → specialised adult structures.","Remember the five diagnostic chordate characters and distinguish Urochordata/Cephalochordata from vertebrates.","notochord + dorsal nerve cord + pharyngeal slits + post-anal tail"],"urochordata":["Urochordates are marine chordates in which the notochord is mainly confined to the larval tail.","Adults are often sessile and have a tunic; the larva shows clearer chordate characters.","The larval notochord and dorsal nerve cord illustrate the chordate plan before metamorphosis.","Free-swimming larva → settlement → metamorphosis → sessile adult in typical ascidians.","Examples include Herdmania and Ascidia; the larval stage is important for identifying chordate features.","larva: notochord in tail → adult: sessile tunicate"],"cephalochordata":["Cephalochordates retain chordate features such as the notochord and dorsal nerve cord throughout life.","The notochord extends along the body, including the head region, and the animals are small marine filter feeders.","Persistent axial structures make them useful for understanding the basic chordate body plan.","Water enters mouth → pharyngeal apparatus filters food → water exits through openings.","Amphioxus/Lancelet is the classic example; unlike vertebrates, a true vertebral column is absent.","notochord extends forward → dorsal nerve cord → pharyngeal slits"],"cell theory":["Cell theory states that cells are the basic structural and functional units of living organisms and that new cells arise from pre-existing cells.","Classical contributors include Schleiden and Schwann; Virchow added the principle of biogenesis at the cellular level.","The theory provides the framework for understanding growth, repair, heredity and organisation in living systems.","Organism → cells → cellular processes → tissues/organs; cell division produces new cells.","Viruses are acellular and therefore do not fit the conventional cellular organisation of living organisms.","organism → tissues → cells → organelles → molecules"],"epithelial tissue":["Epithelial tissue forms continuous sheets covering body surfaces, lining cavities and forming many glands.","Cells are closely packed with little intercellular space and are supported by a basement membrane; types include squamous, cuboidal, columnar and specialised epithelia.","Functions include protection, absorption, secretion, filtration and exchange depending on the epithelial type.","Basal cells attach to basement membrane → cell layers perform barrier/transport/secretion role → surface faces lumen or exterior.","Simple squamous is suited to diffusion; cuboidal to secretion/absorption; columnar to absorption/secretion; ciliated epithelium moves material.","basement membrane → epithelial cells → lumen/exterior"],"connective tissue":["Connective tissue supports, binds, protects and connects body structures and is characterised by cells embedded in an extracellular matrix.","Matrix contains fibres and ground substance; examples include areolar tissue, adipose tissue, cartilage, bone and blood.","The matrix determines mechanical properties, while specialised cells perform storage, defence or transport.","Cells + matrix → structural support/transport/defence → tissue-specific function.","Blood is a connective tissue with a fluid matrix; cartilage and bone have specialised solid matrices.","cells + extracellular matrix → support/transport/defence"],"muscle tissue":["Muscle tissue is specialised for contraction and movement and is classified as skeletal, cardiac or smooth muscle.","Skeletal muscle is striated and usually voluntary; cardiac muscle is striated with intercalated discs; smooth muscle is non-striated and involuntary.","Contraction converts chemical energy into mechanical work and contributes to movement, posture and internal organ function.","Excitation → Ca²⁺ availability → actin–myosin interaction → cross-bridge cycling → contraction.","Cardiac muscle is branched and has intercalated discs; smooth muscle lacks the organised striations of skeletal/cardiac muscle.","motor signal → Ca²⁺ → actin–myosin → contraction"],"algae":["Algae are mostly aquatic, photosynthetic organisms with simple thalloid bodies. They range from unicellular forms to large multicellular seaweeds.","The plant body lacks true roots, stems and leaves; pigments, reserve food and reproductive patterns vary among major groups.","They contribute to primary production and include economically important forms used as food, agar sources or fertilisers.","Light capture → photosynthesis → biomass production; reproduction may be vegetative, asexual or sexual depending on the group.","Examples: Chlamydomonas, Volvox, Ulothrix, Spirogyra and Laminaria; identify groups by pigments and reserve food.","thallus → photosynthesis → aquatic productivity"],"bryophytes":["Bryophytes are non-vascular land plants that require water for sexual reproduction and have a dominant gametophytic phase.","They lack true vascular tissue; rhizoids provide anchorage and the sporophyte remains dependent on the gametophyte.","They occupy moist habitats and represent an important transition in land-plant evolution.","Spore → gametophyte → gametes → fertilisation in water → dependent sporophyte → spores.","Marchantia and Funaria are standard examples; water is essential for fertilisation.","spore → gametophyte → fertilisation → sporophyte"],"pteridophytes":["Pteridophytes are seedless vascular plants with true roots, stems and leaves and a dominant sporophyte.","Xylem and phloem enable efficient transport; spores are produced by sporangia, and water is still required for fertilisation in typical forms.","They represent a major evolutionary step in vascular plant organisation before the seed habit.","Sporophyte → sporangia → spores → gametophyte → antherozoids/oosphere → fertilisation → sporophyte.","Examples include Selaginella, Equisetum and Pteris; heterospory in some forms is linked with the evolution of seed habit.","vascular sporophyte → spores → gametophyte → fertilisation"],"gymnosperms":["Gymnosperms are seed-producing vascular plants in which ovules/seeds are not enclosed within an ovary/fruit.","They commonly bear cones, have well-developed vascular tissues and show a dominant sporophyte with reduced gametophytes.","Seeds provide protection and dispersal advantages over spores, while pollen reduces dependence on external water for sperm transport.","Pollen → pollination → pollen tube growth → fertilisation → exposed seed development.","Cycas and Pinus are classic examples; ovules are exposed on megasporophylls or cone structures.","pollen → ovule → fertilisation → naked seed"],"angiosperms":["Angiosperms are flowering plants in which ovules are enclosed within an ovary and seeds develop inside fruits.","Flowers organise reproductive structures; the female gametophyte develops within the ovule and the male gametophyte is carried by pollen.","They show highly specialised pollination, double fertilisation and fruit formation.","Pollination → pollen germination → pollen tube growth → double fertilisation → embryo/endosperm → seed → fruit.","Double fertilisation is unique to angiosperms: one male gamete forms the zygote and the other participates in endosperm formation.","flower → pollination → double fertilisation → seed + fruit"],"root":["A root is the usually underground organ that anchors a plant and absorbs water and minerals; it also conducts and may store food.","Root cap protects the tip; meristematic, elongation and maturation zones occur behind it, with root hairs increasing absorptive area.","Roots provide anchorage and establish the plant’s water/mineral supply.","Root hairs contact soil solution → water/ions enter → xylem transport → upward movement.","Root hairs arise from epidermal cells in the maturation zone; roots generally lack nodes and internodes.","root cap → meristem → elongation → maturation/root hairs"],"leaf":["A leaf is the principal photosynthetic organ of most plants and also participates in transpiration and gas exchange.","Typical leaves have a lamina, petiole and veins; stomata regulate gas exchange and water loss.","Chloroplast-rich mesophyll captures light while vascular bundles distribute water and export assimilates.","Light capture → CO₂ entry through stomata → photosynthesis → carbohydrate export; transpiration drives water loss.","Leaf venation, phyllotaxy and stomatal distribution are useful morphological identifiers.","epidermis → mesophyll → vascular bundle → stomata"],"xylem":["Xylem is the vascular tissue that conducts water and mineral ions mainly from roots toward aerial parts and also provides mechanical support.","Tracheids and vessels are conducting elements; fibres and parenchyma contribute support and storage.","The transpiration stream supplies leaves and helps maintain plant water balance.","Root uptake → xylem loading → cohesion-tension driven ascent → leaf veins → mesophyll.","Mature vessel elements and tracheids are generally dead at functional maturity; xylem transport is predominantly upward.","root → xylem → stem → leaf"],"phloem":["Phloem is the vascular tissue responsible for translocation of organic solutes, especially sucrose, from sources to sinks.","Sieve tube elements are associated with companion cells; sieve plates connect sieve-tube elements.","It distributes assimilates to growing tissues, storage organs and developing reproductive structures.","Source loading → pressure build-up → bulk flow through sieve tubes → unloading at sink.","Phloem translocation can occur in different directions in different sieve tubes depending on source–sink relationships.","source → phloem → sink"],"chloroplast":["Chloroplasts are double-membrane plastids that perform photosynthesis in plants and algae.","Thylakoid membranes form grana and contain photosystems and electron carriers; the stroma contains enzymes of carbon fixation.","They convert light energy into chemical energy and reduce carbon dioxide to carbohydrate precursors.","Photon absorption → electron transport/proton gradient → ATP and NADPH → carbon fixation in stroma.","Chloroplasts contain their own DNA and ribosomes and are semiautonomous organelles.","grana/thylakoids → light reactions; stroma → Calvin cycle"],"osmosis":["Osmosis is the net movement of water through a selectively permeable membrane toward the region of lower water potential.","Water potential is influenced by solute potential and pressure potential; membranes differ in permeability to water and solutes.","It governs turgor, water uptake and many plant-cell responses to external solutions.","Water moves down water-potential gradient until equilibrium or a counteracting pressure is reached.","Adding solute usually lowers water potential; plasmolysis occurs when a plant cell loses water in a sufficiently hypertonic environment.","high ψw → membrane → low ψw"],"photosynthesis":["Photosynthesis uses light energy to drive carbon fixation and carbohydrate synthesis in chlorophyll-containing cells.","Light reactions occur in thylakoid membranes; the Calvin cycle occurs in the stroma. Photosystems I and II, electron carriers and ATP synthase coordinate energy conversion.","ATP and NADPH produced by light reactions provide energy and reducing power for carbon assimilation.","Light → PSII/water oxidation → electron transport → ATP → PSI/NADPH → Calvin cycle → carbohydrate.","PSII reaction centre P680; PSI P700; oxygen released originates from water. C4 plants initially fix CO₂ using PEP carboxylase.","light → thylakoid reactions → ATP/NADPH → Calvin cycle"],"atomic mass":["Atomic mass on the relative atomic-mass scale describes the mass of an atom relative to the chosen standard; average atomic mass accounts for isotopic abundance.","For an element with several isotopes, the average is a weighted mean of isotope masses.","Atomic masses are used to calculate molecular/formula masses and molar masses for stoichiometry.","isotope mass × fractional abundance → sum → average atomic mass.","Mass number belongs to one isotope; average atomic mass is the abundance-weighted value for the element.","isotopes → abundance weighting → average atomic mass"],"molecular mass":["Molecular mass is the sum of the relative atomic masses of all atoms present in a molecule.","It is dimensionless on the relative scale; the corresponding molar mass has units g mol⁻¹.","It is used in converting between molecular composition and molar quantities.","Count atoms in formula → multiply by atomic masses → sum contributions.","Do not confuse molecular mass with molar mass: their numerical values may match but units/concepts differ.","formula → atomic contributions → molecular mass"],"percentage composition":["Percentage composition gives the mass percentage contributed by each element in a compound.","For each element, divide its total mass contribution in one mole/formula unit by molar mass and multiply by 100.","It helps determine empirical formulas and check the composition of compounds.","Formula → elemental mass contribution → divide by molar mass → ×100.","Percentages should sum to approximately 100% after accounting for rounding.","compound → element mass fractions → percentages"],"empirical formula":["An empirical formula gives the simplest whole-number ratio of atoms in a compound.","Percent composition or masses are converted to moles and then divided by the smallest mole value.","It provides the simplest stoichiometric ratio and can be scaled to obtain a molecular formula when molar mass is known.","%/atomic mass → mole ratio → divide by smallest → multiply to whole numbers → empirical formula.","Molecular formula is an integer multiple of the empirical formula.","percentage → moles → simplest ratio → empirical formula"],"planck theory":["Planck proposed that electromagnetic energy is exchanged in discrete quanta rather than continuously, with energy proportional to frequency.","A quantum has energy E=hν; higher frequency means larger energy per quantum.","The idea forms a foundation for quantum theory and explains features of blackbody radiation.","Frequency ν → quantum energy hν → absorption/emission in discrete packets.","Do not confuse photon intensity with photon energy: at fixed frequency, intensity mainly changes photon number, while energy per photon is hν.","ν → photon quantum E=hν"],"quantum numbers":["Quantum numbers specify the allowed state of an electron in an atom within the quantum-mechanical model.","n gives principal shell; l subshell; m_l orbital orientation; m_s spin.","They define orbital size/energy class, shape, orientation and spin state.","Choose n → allowed l values 0…n−1 → allowed m_l values −l…+l → m_s=±1/2.","No two electrons in an atom can have the same set of all four quantum numbers.","n → l → m_l → m_s"],"orbitals":["An orbital is a region of space described by a wavefunction where there is a high probability of finding an electron.","s orbitals are spherical; p orbitals are dumbbell-shaped; d and f orbitals have more complex angular distributions.","Orbital shape and orientation help explain bonding and electron distribution.","Quantum numbers define orbital → electron probability distribution → occupancy follows Pauli, Hund and Aufbau principles.","Each orbital accommodates a maximum of two electrons with opposite spins.","shell → subshell → orbital → electron occupancy"],"periodic trends":["Periodic trends are systematic changes in elemental properties across periods and down groups caused largely by nuclear charge, shielding and electron-shell structure.","Atomic size, ionisation enthalpy, electron-gain tendency and electronegativity show characteristic trends with important exceptions.","Trends allow prediction of reactivity and bonding behaviour.","Across a period effective nuclear charge generally increases; down a group additional shells increase size and shielding.","Always compare elements within the same period/group before applying a trend; exceptions arise from subshell stability and pairing.","atomic number → configuration → effective nuclear charge → property"],"lewis structures":["Lewis structures represent valence electrons as bonds and lone pairs to show connectivity and electron counting.","Start with total valence electrons, choose a skeleton, complete octets/duets and use multiple bonds or formal charges when required.","They help predict connectivity, resonance and approximate molecular geometry.","Count valence electrons → skeleton → single bonds → complete outer atoms → central atom octet → check formal charges.","Hydrogen follows a duet; elements in period 3 and beyond can show expanded valence in appropriate compounds.","valence electrons → bonds/lone pairs → Lewis structure"],"ionic bond":["An ionic bond is electrostatic attraction between oppositely charged ions formed after electron transfer or charge separation.","Cations and anions arrange in a crystal lattice; lattice enthalpy reflects the strength of ionic interactions.","Ionic bonding explains high melting points, crystal structures and electrical conduction in molten/aqueous states.","Electron transfer/charge formation → ion attraction → lattice formation.","Higher ionic charge and smaller ionic radii generally strengthen lattice interactions.","cation + anion → ionic lattice"],"covalent bond":["A covalent bond forms when atoms share electron pairs. Bond order, length and energy depend on electron distribution and orbital overlap.","Single, double and triple bonds contain one, two and three shared electron pairs respectively; sigma and pi components describe overlap.","Covalent bonding determines molecular geometry, polarity and reactivity.","Orbital overlap → shared electron density → sigma/pi bonding → molecular structure.","Multiple bonds are generally shorter and stronger than corresponding single bonds; rotation about double bonds is restricted.","orbital overlap → shared pair → σ/π bond"],"hydrogen bonding":["Hydrogen bonding is an attractive interaction involving H bonded to a strongly electronegative atom such as N, O or F and a lone pair on another electronegative atom.","It may be intermolecular or intramolecular and is stronger than ordinary dipole–dipole interactions but weaker than covalent bonds.","It strongly affects boiling points, solubility, molecular association and biological structures.","Polar X–H bond → H becomes partially positive → attraction to lone pair on N/O/F.","Water’s high boiling point and DNA base-pairing are important consequences of hydrogen bonding.","X–H···Y"],"first law":["The first law of thermodynamics expresses conservation of energy for a thermodynamic system.","With the common chemistry sign convention, ΔU=q+w; q is heat supplied to the system and w is work done on the system.","It connects heat, work and internal-energy changes for chemical and physical processes.","Energy enters as heat/work → internal energy changes → ΔU accounts for net energy change.","Sign conventions must be stated; expansion work in chemistry is often negative for work done by the system.","q + w → ΔU"],"enthalpy":["Enthalpy is a state function defined as H=U+PV and is especially useful for processes carried out at constant pressure.","For constant-pressure processes with only PV work, ΔH equals heat exchanged at constant pressure.","It quantifies heat effects of reactions and phase changes under specified conditions.","Initial H → reaction/transition → final H → ΔH=H_final−H_initial.","Exothermic processes have ΔH<0 and release heat to surroundings under the usual sign convention.","reactants H → ΔH → products H"],"kohlrausch law":["Kohlrausch’s law states that at infinite dilution the molar conductivity of an electrolyte is the sum of the independent contributions of its ions.","Λ°m = λ°+ + λ°− for a simple 1:1 electrolyte; stoichiometric coefficients are included for other formulas.","It helps calculate limiting molar conductivity and degree of dissociation/related quantities.","Electrolyte → ionic contributions → sum of limiting ionic conductivities.","Use limiting values at infinite dilution, not arbitrary concentration values.","cation λ° + anion λ° → Λ°m"],"faraday laws":["Faraday’s laws connect the amount of substance deposited or liberated during electrolysis with the quantity of electric charge passed.","Charge Q=It; deposited amount is proportional to charge and depends on the substance’s equivalent weight.","They convert electrical measurements into electrochemical stoichiometry.","Current × time → charge → moles of electrons → deposited substance.","One Faraday corresponds approximately to one mole of electrons; balance electron transfer carefully.","I×t → Q → e− equivalents → deposited mass"],"rate law":["A rate law relates reaction rate to concentrations of reactants with experimentally determined orders.","For rate = k[A]^m[B]^n, overall order is m+n; exponents need not equal stoichiometric coefficients in a general rate law.","It allows quantitative prediction of how concentration changes affect rate.","Measure rate at different concentrations → determine exponents → calculate k.","Order is experimentally determined; do not infer it blindly from a balanced overall equation.","concentration → rate law → rate"],"activation energy":["Activation energy is the energy barrier that reacting particles must effectively overcome to reach the transition state.","In the Arrhenius model, k depends exponentially on −Ea/RT. A catalyst lowers the effective activation barrier by providing an alternative pathway.","It explains strong temperature dependence of reaction rates and catalytic acceleration.","Reactants → activation barrier → activated complex → products.","A catalyst changes the pathway and rate but does not change the equilibrium constant for a given temperature.","reactants → Ea barrier → products"],"adsorption":["Adsorption is accumulation of particles at a surface, giving the surface a higher concentration than the bulk phase.","Physisorption uses weak intermolecular forces; chemisorption involves stronger chemical interaction and is usually more specific.","It is important in catalysis, gas purification, chromatography and surface processes.","Adsorbate approaches surface → interaction → surface coverage → equilibrium.","Adsorption is a surface phenomenon; increasing surface area generally increases adsorption capacity.","bulk → surface → adsorbed layer"],"coordination number":["Coordination number is the number of donor atoms directly bonded to the central metal ion in a coordination complex.","It depends on the ligand arrangement and geometry; common values include 4 and 6.","It helps identify complex geometry and distinguish coordination sphere from oxidation state.","Count donor atoms directly attached to metal → coordination number.","A bidentate ligand contributes two donor atoms to coordination number, while a monodentate ligand contributes one.","M ← donor atoms → coordination number"],"iupac nomenclature":["IUPAC nomenclature provides systematic names for organic compounds based on the parent structure, functional groups and substituent positions.","Choose the appropriate parent chain/ring, identify the principal functional group, number for lowest locants and name substituents.","It converts structural information into an unambiguous chemical name.","Principal group → parent → numbering → substituents → suffix/prefix → final name.","Numbering priority is determined by the principal functional group and multiple-bond rules, not by whichever end looks convenient.","structure → parent → locants → name"],"sn1":["SN1 is a unimolecular nucleophilic substitution mechanism proceeding through a carbocation intermediate.","The rate-determining step is ionisation of the substrate; polar protic solvents often favour the pathway.","It explains substitution reactions of suitable tertiary and some secondary substrates and can lead to racemisation at a chiral centre.","R–X → carbocation + X− → nucleophile attack → product.","Rate depends primarily on substrate concentration: rate=k[R–X]. Carbocation stability strongly affects feasibility.","substrate → carbocation → nucleophile → product"],"sn2":["SN2 is a one-step bimolecular nucleophilic substitution in which the nucleophile attacks as the leaving group departs.","The transition state contains both substrate and nucleophile; backside attack gives inversion at a stereogenic carbon.","It explains why less hindered substrates react more readily by this pathway.","Nu− attack from backside → simultaneous bond making/breaking → inverted product.","Rate=k[substrate][nucleophile]; steric hindrance strongly slows SN2 reactions.","Nu− → R–X (backside) → R–Nu + X−"],"aldol reaction":["Aldol reaction involves carbonyl compounds with an appropriate α-hydrogen forming a β-hydroxy carbonyl compound under suitable base/acid conditions, often followed by dehydration.","Enolate/enol formation creates a nucleophilic α-carbon that attacks another carbonyl carbon.","It forms a new C–C bond and is a key carbonyl condensation reaction.","Enolate → carbonyl attack → β-hydroxy product → dehydration when conditions favour it.","Presence of an α-hydrogen is important for the usual self-aldol pathway.","enolate + carbonyl → β-hydroxy carbonyl → α,β-unsaturated product"],"diazotisation":["Diazotisation converts a primary aromatic amine into an aryl diazonium salt using nitrous acid generated in situ under cold acidic conditions.","The diazonium group is a versatile intermediate for substitution and azo-coupling reactions.","It enables replacement of –NH2 by several groups and formation of azo dyes.","Ar–NH2 + NaNO2/HCl, 0–5°C → Ar–N2+Cl− → subsequent reaction.","Temperature control around 0–5°C is a classic NEET detail for stable preparation of aromatic diazonium salts.","Ar–NH2 → Ar–N2+ → substitution/coupling"],"si units":["SI units form the internationally standardised system for measuring physical quantities.","Seven base quantities have base units: metre, kilogram, second, ampere, kelvin, mole and candela; derived units are built from them.","Consistent units prevent numerical errors and allow dimensional checks.","Physical quantity → SI unit → numerical value → dimensional verification.","Use kg, m, s, A, K, mol and cd for the seven base units; derived quantities such as N and J are combinations.","base quantities → SI units → derived units"],"dimensions":["Dimensions express a physical quantity in terms of fundamental dimensions such as mass M, length L and time T.","For example, velocity has [LT⁻¹], force [MLT⁻²] and energy [ML²T⁻²].","Dimensional analysis checks equations and helps derive relations up to dimensionless constants.","Quantity → fundamental dimensions → dimensional formula → compare both sides.","Dimensional correctness does not guarantee an equation is physically complete; numerical constants can remain undetermined.","quantity → M,L,T,… → dimensional formula"],"significant figures":["Significant figures indicate the meaningful digits justified by the precision of a measurement.","Rules differ for non-zero digits, zeros between significant digits and leading/trailing zeros; calculation rules depend on multiplication/division or addition/subtraction.","They prevent reporting more precision than the measurement supports.","Measured value → identify significant digits → calculate → round according to the appropriate rule.","In multiplication/division, the result generally follows the least number of significant figures among inputs.","measurement → significant digits → reported result"],"errors":["Measurement error is the difference between a measured value and the true/accepted value, with experimental uncertainty arising from limitations of instruments and methods.","Absolute, relative and percentage errors quantify uncertainty; systematic and random errors have different origins.","Error analysis helps judge reliability and combine uncertainties.","Measure → estimate uncertainty/error → combine appropriately → report result with justified precision.","Relative error is dimensionless; percentage error is relative error ×100.","measurement → error → uncertainty → reported value"],"velocity":["Velocity is the vector rate of change of displacement.","Average velocity = displacement/time; instantaneous velocity is dx/dt. Direction is essential because velocity is not just speed.","Velocity describes how position changes and is central to kinematics.","Position x(t) → slope dx/dt → velocity v(t); area under v–t graph gives displacement.","Average velocity may be zero even when distance travelled is non-zero.","x–t slope → v; v–t area → displacement"],"acceleration":["Acceleration is the rate of change of velocity, a=dv/dt.","It may change speed, direction or both; uniform circular motion has acceleration even at constant speed.","Acceleration links net force to motion through Newton’s second law.","Velocity change → acceleration; from v–t graph, slope gives acceleration.","Negative acceleration is not automatically deceleration; compare acceleration direction with velocity direction.","v–t slope → a"],"vectors":["A vector has both magnitude and direction and is represented by directed components.","A vector can be resolved into perpendicular components; vector addition follows the parallelogram/triangle rules.","Vectors describe displacement, velocity, acceleration, force and other directional quantities.","Choose axes → resolve components → add component-wise → reconstruct magnitude/direction.","Do not add vector magnitudes directly unless vectors are parallel and same-direction under the given conditions.","A = Ax i + Ay j"],"projectile motion":["Projectile motion is motion under gravity after launch when air resistance is neglected. Horizontal and vertical components evolve independently.","Initial velocity components are u cosθ and u sinθ; ax=0 and ay=−g.","It produces a parabolic trajectory for same-level launch and landing.","x=u cosθ t; y=u sinθ t−½gt²; combine components to find T, H and R.","Same-level: T=2u sinθ/g, H=u²sin²θ/(2g), R=u²sin2θ/g; maximum range at 45°.","u → horizontal/vertical components → parabolic path"],"newton first law":["Newton’s first law states that a body maintains uniform velocity or rest unless acted on by a net external force.","The law introduces inertia and defines inertial frames in classical mechanics.","It explains why motion does not require a continuous force when net force is zero.","ΣF=0 → a=0 → velocity remains constant.","A non-zero individual force is possible while net force is zero; equilibrium is about resultant force.","ΣF=0 → constant velocity"],"newton second law":["Newton’s second law states that net external force equals the rate of change of momentum; for constant mass, ΣF=ma.","Force is a vector and must be resolved consistently with the chosen axes.","It provides the main equation for translational dynamics.","Draw FBD → choose axes → resolve forces → apply ΣF=ma → solve unknowns.","Use the net force, not one force in isolation; signs and directions matter.","forces → ΣF → acceleration"],"newton third law":["Newton’s third law states that forces between two interacting bodies occur in equal-magnitude, opposite-direction pairs.","The pair acts on different bodies, so the two forces do not cancel when analysing one body.","It explains recoil, walking, propulsion and contact-force interactions.","Body A acts on B → B acts simultaneously on A with equal/opposite force.","Action–reaction forces are of the same type and act on different objects.","A → B force; B → A equal/opposite force"],"friction":["Friction is a tangential contact force that opposes relative motion or its tendency between surfaces.","Static friction adjusts up to μsN; kinetic friction is approximated as μkN during sliding.","It provides traction but can dissipate mechanical energy during sliding.","Find N → decide static/sliding → apply correct friction relation → set direction opposite relative motion/tendency.","Static friction is not always μsN; that is the maximum value.","applied force → tendency ← friction"],"work energy theorem":["The work-energy theorem states that net work done on a particle equals its change in kinetic energy.","W_net = ΔK; the theorem is valid whether work comes from conservative or non-conservative forces.","It often simplifies problems where force and displacement are easier to analyse than acceleration and time.","Initial K + net work → final K.","Negative net work reduces kinetic energy; work and energy are scalar quantities.","W_net → ΔK"],"power":["Power is the rate at which work is done or energy is transferred.","Average power = W/Δt; instantaneous power P=dW/dt and for a force P=F·v.","It measures how quickly energy is transferred, not how much total work is done.","Work/energy transfer → divide by time → power.","SI unit is watt; two machines can do the same work but have different power if times differ.","work/energy → rate → power"],"coulomb law":["Coulomb’s law gives the electrostatic force between two point charges.","Magnitude F=(1/4πε0)|q1q2|/r²; direction is along the line joining the charges.","It is the foundation for electric-field and electrostatic-force calculations.","Identify charge signs → compute magnitude → assign attraction/repulsion direction → superpose if needed.","Like charges repel and unlike charges attract; inverse-square dependence on separation is essential.","q1 ↔ electrostatic force ↔ q2"],"electric field":["Electric field is force per unit positive test charge at a point.","For a point charge, E=(1/4πε0)Q/r² and is directed outward for positive Q and inward for negative Q.","It describes the influence of source charge on surrounding space.","Calculate individual fields → vectorially superpose → obtain net field.","Electric field is vector; electric potential is scalar.","source charge → E field → test charge"],"electric potential":["Electric potential at a point is potential energy per unit positive test charge.","For a point charge V=(1/4πε0)Q/r; potential is scalar and therefore adds algebraically.","Potential provides a convenient energy-based description of electrostatic systems.","Find potentials from each source → add scalarly → relate to potential energy U=qV.","Potential may be zero while electric field is non-zero; field relates to the spatial gradient of potential.","charge → potential V → potential energy qV"],"capacitance":["Capacitance measures the charge stored per unit potential difference: C=Q/V.","For an ideal parallel-plate capacitor, C=εA/d; inserting dielectric changes the effective permittivity.","Capacitors store electrostatic energy and are used in filtering, timing and energy-storage circuits.","Charge accumulates on plates → electric field develops → potential difference → stored energy.","Energy U=½CV²=Q²/(2C)=½QV.","plates → electric field → V → stored charge/energy"],"ohm law":["Ohm’s law states that for a conductor under constant physical conditions, V is proportional to I: V=IR.","Resistance depends on geometry, material and temperature; resistivity is a material property.","It links circuit voltage and current for ohmic elements.","V/I constant under stated conditions → determine R → use circuit laws.","Ohm’s law is not universal for non-ohmic devices; always inspect the V–I relationship.","V → resistor → I"],"kirchhoff laws":["Kirchhoff’s rules express conservation of charge and energy in electrical circuits.","At a junction ΣI=0; around a closed loop ΣΔV=0 with a consistent sign convention.","They solve multi-loop circuits and networks beyond simple series-parallel reduction.","Assume branch currents → write junction equations → write loop equations → solve simultaneously.","A negative calculated current means the real direction is opposite the assumed direction.","junction: ΣI=0; loop: ΣΔV=0"],"faraday law":["Faraday’s law states that changing magnetic flux through a circuit induces an emf: ε=−dΦ/dt.","Flux can change through magnetic-field strength, area or orientation.","It is the basis of electromagnetic induction, generators and transformers.","Change Φ → induced emf → current if circuit closed.","The negative sign expresses Lenz’s law; no flux change means no induced emf in the ideal model.","changing Φ → induced ε → induced current"],"lorentz force":["Lorentz force is the force on a charged particle due to electric and magnetic fields: F=q(E+v×B).","The magnetic part is perpendicular to velocity and magnetic field; the electric part can do work.","It governs charged-particle motion in electric and magnetic fields.","Identify E and B → calculate electric and magnetic contributions → vectorially add.","A pure magnetic field does no work on an ideal free charge because magnetic force is perpendicular to velocity.","q + E/B → Lorentz force → motion"],"bohr model":["Bohr’s model describes hydrogen-like atoms using discrete stationary energy levels and quantised angular momentum.","Electrons emit or absorb photons when moving between allowed levels; E_photon=|ΔE|.","It explains the hydrogen spectrum and provides a simple quantised energy picture.","Level transition → photon absorption/emission → spectral line.","Hydrogen-like energy levels scale with −Z²/n²; the model has limitations for multi-electron atoms.","n_i → photon → n_f"],"photoelectric effect":["The photoelectric effect is emission of electrons when incident radiation has frequency at or above a material’s threshold frequency.","Photon energy hν is used partly for work function φ and the remainder becomes maximum kinetic energy.","It demonstrates the particle nature of light and the frequency dependence of electron energy.","hν → φ + Kmax; stopping potential satisfies eVs=Kmax.","Above threshold, increasing intensity mainly increases the number of emitted electrons, while frequency controls maximum kinetic energy.","photon → work function + electron kinetic energy"],"de broglie wavelength":["de Broglie proposed that moving matter has an associated wavelength λ=h/p.","For non-relativistic motion, p=mv, so λ=h/(mv).","It explains matter-wave effects such as electron diffraction.","Find momentum → λ=h/p → compare wavelengths under the stated condition.","Higher momentum means shorter wavelength; equal kinetic-energy comparisons must account for mass.","particle momentum p ↔ λ=h/p"],"half life":["Half-life is the time required for a radioactive sample to reduce to half its initial number of undecayed nuclei.","For first-order radioactive decay, T1/2=0.693/λ and N/N0=(1/2)^n after n half-lives.","It gives a convenient time scale for radioactive decay.","N0 → N0/2 → N0/4 → N0/8 after successive half-lives.","Half-life of a given radioactive isotope is independent of the initial amount in the simple decay law.","N0 → N0/2 → N0/4 → …"],"pn junction":["A p–n junction joins p-type and n-type semiconductor regions and develops a depletion region and built-in electric field.","Forward bias reduces the barrier and widens current flow; reverse bias increases the barrier and keeps current small until breakdown.","Its rectification behaviour is the basis of diodes and many electronic circuits.","Junction formation → depletion region → biasing → carrier movement → current.","Forward bias: p-side positive relative to n-side; conventional current direction differs from electron motion.","p | depletion region | n"]};
function topicKnowledge(t){
 const raw=(t.title||'').trim(), key=raw.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 const p=TOPIC_PROFILES[key];
 if(p)return {defn:p[0],parts:p[1],func:p[2],proc:p[3],formula:'',neet:p[4],diagram:p[5]};
 const ch=t.chapter||'', subj=t.subject||'';
 const practice=/NEET Practice Topic|Revision|Strategy|Focus|Prevention|Integration|Practice|One Shot|Mock Test|Weak Area|Final Revision|Mixed Practice|Drill|Facts|Traps|Repair/i.test(raw+' '+ch);
 if(practice)return {defn:`<b>${esc(raw)}</b> is a focused NEET practice module under <b>${esc(ch)}</b>. It targets recall, application and question-solving around the named skill rather than introducing a new textbook chapter.`,parts:`Work with the exact skill named <b>${esc(raw)}</b>: identify the question type, required information, relevant concept/formula, common distractor and the final check.`,func:`The value of <b>${esc(raw)}</b> is speed and accuracy in <b>${esc(ch)}</b>. Use it after learning the underlying theory, especially for statement, diagram, numerical or comparison questions.`,proc:`Read the question → identify what <b>${esc(raw)}</b> is testing → select the relevant concept → eliminate incompatible options → calculate/compare if needed → check units/conditions → mark the answer.`,formula:`For <b>${esc(raw)}</b>, use the exact equation/reaction/sequence taught in <b>${esc(ch)}</b>; never substitute numbers before identifying the governing relation.`,neet:`NEET focus: <b>${esc(raw)}</b> should be practised with timed questions and an error log. Record why each wrong option was rejected and which condition changed the answer.`,diagram:`${esc(ch)} → ${esc(raw)} → identify clue → apply concept → verify answer`};
 const domain=subj==='physics'?'physics':subj==='chemistry'?'chemistry':subj==='botany'?'botany':'zoology';
 return {defn:`<b>${esc(raw)}</b> is a specific concept within <b>${esc(ch)}</b>. In this ${domain} context, learn its exact meaning, distinguishing feature and connection to the chapter rather than treating the topic as an isolated definition.`,parts:`For <b>${esc(raw)}</b>, identify the named structure/process/quantity first, then note its components, location or variables and the condition that controls its behaviour.`,func:`<b>${esc(raw)}</b> matters because its defining feature changes or explains an important part of <b>${esc(ch)}</b>. NEET questions can test it through identification, comparison, sequence, application or a condition-based statement.`,proc:`Start from <b>${esc(raw)}</b> → identify its defining element → connect it to <b>${esc(ch)}</b> → apply the relevant principle or sequence → check the standard example/exception → verify the result.`,formula:`For <b>${esc(raw)}</b>, write the governing relation/reaction/sequence before substitution or memorisation. Define symbols and conditions and check the final answer against physical, chemical or biological meaning.`,neet:`NEET focus for <b>${esc(raw)}</b>: exact terminology, one distinguishing feature, one application/example, one common confusion and the relevant condition/exception.`,diagram:`${esc(ch)} → ${esc(raw)} → defining feature → mechanism/application`};
}
function buildMCQs(t,k){
 const out=[];
 const existing=(t.mcqs||[]).filter(m=>!/^Which approach is most appropriate while studying/i.test(m.q||'') && !/^In a question based on/i.test(m.q||'') && !/^Which revision method/i.test(m.q||'') && !/^If a question on/i.test(m.q||'') && !/^Which statement best describes good NEET practice/i.test(m.q||''));
 existing.slice(0,5).forEach(m=>out.push(m));
 return out.slice(0,5);
}
function renderTheory(t){
 const title=esc(t.titleHi||t.title), chap=esc(t.chapterHi||t.chapter);
 const clean=x=>String(x||'').replace(/\n/g,'<br>');
 const strip=x=>String(x||'').replace(/^\[[^\]]+\]\s*/,'').replace(/^\*\*.*?\*\*:?\s*/,'').trim();
 const notes=(t.notes||[]).filter(Boolean).map(strip);
 const points=(t.keyPoints||[]).filter(Boolean).map(strip);
 const n=i=>notes[i]||'';
 const core=n(0)||`${title} — ${chap}`;
 const concept=n(1)||core, neet=n(2)||core, trap=n(3)||core, revision=n(4)||core, mechanism=n(5)||concept;
 const uniqueCheck=`${title} में ऊपर दिए गए defining fact को बिना देखे बताइए और उसे ${chap} के संबंधित concept/example से जोड़िए।`;
 let mcqs=(t.mcqs||[]).filter(m=>m && m.q && Array.isArray(m.options) && m.options.length>=2).slice(0,5);
 if(!mcqs.length) mcqs=[{q:`${title} के बारे में सही कथन चुनिए।`,options:[core,'यह कथन इस topic से संबंधित नहीं है।','इस topic की कोई पहचान नहीं होती।','यह केवल किसी दूसरे chapter पर लागू होता है।'],answer:0,explanation:core}];
 const mcqHtml=mcqs.map((m,i)=>`<div class="mcq"><b>Q${i+1}. ${esc(m.q)}</b>${(m.options||[]).map((o,j)=>`<button class="option" data-mcq="${esc(String(t.id))}|${i}|${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div id="ans-${t.id}-${i}" class="answer" style="display:none"><b>उत्तर: ${String.fromCharCode(65+(Number.isInteger(m.answer)?m.answer:0))}</b><br>${esc(m.explanation||core)}</div></div>`).join('');
 const notesHtml=[['Core Answer / मुख्य उत्तर',core],['Concept / Structure / अवधारणा',concept],['NEET Focus / परीक्षा बिंदु',neet],['Common Confusion / सावधानी',trap],['Quick Revision / त्वरित पुनरावृत्ति',revision],['Mechanism / Connection / संबंध',mechanism],['Active Recall / याद जाँच',uniqueCheck]].map(x=>`<div class="callout"><b>${x[0]}</b><br>${clean(x[1])}</div>`).join('');
 const pointHtml=points.length?`<ul>${points.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
 return `<section id="intro" class="panel"><h2>📖 Introduction / परिचय</h2><p><b>${title}</b> — <b>${chap}</b></p>${notesHtml}</section>
 <section id="definition" class="panel"><h2>📌 Definition / परिभाषा</h2><p>${clean(core)}</p></section>
 <section id="structure" class="panel"><h2>🧩 Structure / मुख्य घटक</h2><p>${clean(concept)}</p>${pointHtml}</section>
 <section id="function" class="panel"><h2>⚙️ Function / महत्व</h2><p>${clean(neet)}</p></section>
 <section id="mechanism" class="panel"><h2>🔄 Process / Mechanism / प्रक्रिया</h2><p>${clean(mechanism)}</p></section>
 <section id="neet" class="panel"><h2>🎯 NEET Focus / High-Yield Points</h2><p>${clean(neet)}</p><div class="callout"><b>Topic-specific caution:</b><br>${clean(trap)}</div></section>
 <section id="diagram" class="panel"><h2>🖼️ Topic-Specific Diagram / Concept Map</h2><div class="diagram"><div class="flowbox"><span class="node">${chap}</span><span class="arrowbig">→</span><span class="node">${title}</span><span class="arrowbig">→</span><span class="node">Defining feature</span><span class="arrowbig">→</span><span class="node">Application</span></div><p class="muted">Concept map is tied to this topic's stored answer.</p></div></section>
 <section id="mcq" class="panel"><h2>❓ Topic-Specific MCQ Test</h2>${mcqHtml}</section>
 <section id="revision" class="panel"><h2>⚡ Quick Revision / त्वरित पुनरावृत्ति</h2><ul><li><b>Topic:</b> ${title}</li><li><b>Chapter:</b> ${chap}</li><li><b>Core:</b> ${clean(core)}</li><li><b>Connection:</b> ${clean(mechanism)}</li><li><b>NEET point:</b> ${clean(neet)}</li></ul><div class="callout"><b>Active Recall:</b> ${clean(uniqueCheck)}</div></section>`;
}
function randomTopic(filter){let a=filter?TOPICS.filter(t=>t.subject===filter):TOPICS;if(!a.length)return;go('topic/'+encodeURIComponent(a[Math.floor(Math.random()*a.length)].id))}
function searchPage(q){let a=TOPICS.filter(t=>(t.title+' '+t.titleHi+' '+t.chapter+' '+t.chapterHi+' '+t.subjectHi).toLowerCase().includes(q.toLowerCase()));app.innerHTML=`<div class="crumb" data-action="home">← होम</div><div class="head"><div><h1>🔎 Search Results</h1><div class="muted">${a.length} results</div></div></div><div class="topic-list">${a.slice(0,500).map(topicCard).join('')||'<div class="empty">कोई topic नहीं मिला।</div>'}</div>`}
function route(){let p=decodeURIComponent(location.hash.slice(1));if(!p)return home();let a=p.split('/');if(a[0]==='home')return home();if(a[0]==='subjects')return subjects();if(a[0]==='subject')return subject(a[1]);if(a[0]==='chapter')return chapter(a[1],a.slice(2).join('/'));if(a[0]==='topic')return topic(a.slice(1).join('/'));if(a[0]==='search')return searchPage(a.slice(1).join('/'));home()}
document.addEventListener('click',e=>{let x=e.target.closest('[data-action]');if(x){let a=x.dataset.action;if(a==='home')go('home');else if(a==='subjects')go('subjects');else if(a==='random')randomTopic();else if(a==='random-subject')randomTopic(x.dataset.subject);return}let tc=e.target.closest('[data-topic]');if(tc){go('topic/'+encodeURIComponent(tc.dataset.topic));return}let tn=e.target.closest('[data-topic-nav]');if(tn&&tn.dataset.topicNav){go('topic/'+encodeURIComponent(tn.dataset.topicNav));return}let cc=e.target.closest('[data-chapter]');if(cc&&cc.dataset.subject){go('chapter/'+cc.dataset.subject+'/'+encodeURIComponent(cc.dataset.chapter));return}let sc=e.target.closest('[data-subject]');if(sc&&sc.dataset.subject){go('subject/'+sc.dataset.subject);return}let c=e.target.closest('[data-complete]');if(c){let id=String(c.dataset.complete);done.has(id)?done.delete(id):done.add(id);persist();topic(id);return}let sv=e.target.closest('[data-save]');if(sv){let id=String(sv.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);persist();topic(id);return}let mc=e.target.closest('[data-mcq]');if(mc){let [tid,qi,oi]=mc.dataset.mcq.split('|');let t=topicById(tid);let m=t?.mcqs?.[Number(qi)];if(m){document.querySelectorAll('.option').forEach(b=>b.classList.remove('correct'));mc.classList.add('correct');let ans=document.getElementById('ans-'+tid+'-'+qi);if(ans)ans.style.display='block'}return}});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())go('search/'+encodeURIComponent(e.target.value.trim()))});
document.getElementById('theme').onclick=document.getElementById('theme2').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('sm_dark_v2',document.body.classList.contains('dark')?'1':'0')};
if(localStorage.getItem('sm_dark_v2')==='1')document.body.classList.add('dark');window.addEventListener('hashchange',route);route();
</script></body></html>
